run:
  timeout: 3m
  # Ticket 115: without it github.com/gen2brain/jpegxl loads libjxl.dll from the DLL search path, and
  # internal/jxl/nodynamic_guard.go refuses to compile (scripts/lib/gobuildtags.ps1 sets the same tag).
  build-tags:
    - nodynamic

linters:
  disable-all: true
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - gosimple
    - unused
    - typecheck
    - gofmt

issues:
  # temp/ holds untracked scratch/diagnostic programs, not shippable code - don't lint it.
  exclude-dirs:
    - temp
  # Use golangci's built-in default exclusions: the conventional, widely-accepted
  # set that ignores unchecked Close/Flush/print/os.Remove/os.Setenv returns. Genuine
  # unchecked errors outside that set are still reported (and handled explicitly with
  # `_ =` at the call site).
  exclude-use-default: true
