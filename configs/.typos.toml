[default]
extend-ignore-re = [
  "doc-html-translate",
  "epub2html",
  "\\b[0-9a-f]{7,40}\\b",   # git commit SHAs quoted in DEV/research + plan docs
  # A verbatim OCR transcript quoted as evidence in DEV/research/ocr_word_gap_2026-09-12.md: the
  # recognizer's own reading of a Polish poster slogan, diacritics lost. Scoped to the exact string
  # rather than to the word, so "sie" stays a misspelling of "size" everywhere else.
  "Proletarjusze wazystkich krajow taczcie sie",
  # "café" spelled as the bytes a legacy-encoding fixture holds - a Go/JS "\xe9" escape or an RTF
  # "\'e9" hex escape, its backslash doubled inside a JS string - so the tokenizer sees "caf".
  # Scoped to the escape, not to the word.
  "(?i)\\bcaf(\\\\){1,2}(x[0-9a-f]{2}|'[0-9a-f]{2})",
  # Upstream file and licence names quoted verbatim in THIRD-PARTY-NOTICES.txt and the ticket that
  # inventoried them: the MinGW runtime DLL, and a misspelling inside the Qt licence text.
  "libgcc_s_seh-1\\.dll",
  "command line utilties do not require Qt",
]

# Project proper nouns / format acronyms typos misreads as misspellings.
extend-ignore-identifiers-re = [
  "SerZhyAle",   # author handle -> flagged "Ser"
  "PNGs?",       # "PNG"/"PNGs" -> flagged "PN"
]

[default.extend-words]
opf = "opf"      # EPUB OPF package format, not a typo of "of"
mis = "mis"      # valid English prefix, e.g. "mis-tagged"
ist = "ist"      # German stop-word in extension/src/lang.js detection list
ein = "ein"      # German stop-word in extension/src/lang.js detection list
ane = "ane"      # inside a verbatim garbled-OCR evidence excerpt in a done-ticket
flate = "flate"  # the PDF FlateDecode filter (zlib/deflate), not a typo of "flat"
unparseable = "unparseable"  # an accepted spelling beside "unparsable"
# RTF control words the parsers list by name (\falt = alternate font name, \headerr = right-page
# header); both editions carry the same list, internal/rtf/codepage.go and extension/src/rtf.js.
falt = "falt"
headerr = "headerr"
# German and French words that appear inside otherwise-English files (the extension listing table of
# store names, the installer's [CustomMessages]) and cannot be excluded without losing the English
# coverage of those files.
dokument = "dokument"
lokal = "lokal"
contextuel = "contextuel"

[files]
extend-exclude = [
  "temp",
  "a.ps1",                          # scripts launcher: intentionally short mnemonic aliases (nd/ind/ivn/bd..), not prose
  "go.sum",
  "DEV/COMMIT_LOG.md",              # append-only build log: book filenames + hashes
  "manifests",                      # generated winget community-repo manifests
  "internal/bundledtools",          # vendored third-party binaries (e.g. libgcc_s_seh-1.dll)
  "extension/test/reflow.test.mjs", # multilingual reflow fixtures (German "ist ein", hyphenation)

  # Non-English interface copy. `typos` carries an English dictionary and has no per-language mode, so
  # correct German "lokales"/"oder", French "ressources", Italian and Portuguese words all read as
  # misspellings. Only Latin-script languages need an entry - a non-Latin script is skipped anyway.
  # Same reasoning as the language-scoped house-style guard in tests/typography_test.go: a check built
  # for one language must not be run against another. English files stay in scope by being listed out.
  "de", "it", "es", "fr", "pt",                      # the per-language landing pages at the repo root
  "extension/_locales/de", "extension/_locales/it", "extension/_locales/es",
  "extension/_locales/fr", "extension/_locales/pt",
  # The console-string catalogs: 12 translations per English string. Listed by name, so the engine
  # (i18n.go) and its test stay in scope; a new catalog file needs its line here.
  "internal/i18n/i18n_cli.go",
  "internal/i18n/i18n_epub.go",
  "internal/i18n/i18n_limits.go",
  "internal/i18n/i18n_ocr.go",
  "internal/i18n/i18n_pipeline.go",
  "internal/i18n/i18n_reader.go",
  "internal/i18n/i18n_tools.go",
  # Legacy-encoding fixtures (CP1252 / Latin-1 French text, and the generator that writes them):
  # the non-UTF-8 bytes split French words into fragments no dictionary can read.
  "tests/testdata/legacy-text",
  "internal/app/splash/de.txt", "internal/app/splash/it.txt", "internal/app/splash/es.txt",
  "internal/app/splash/fr.txt", "internal/app/splash/pt.txt",
  "cmd/doc-html-ui/i18n.js",                         # all 13 GUI dictionaries in one file
  "tools/store/listing/de.txt", "tools/store/listing/it.txt", "tools/store/listing/es.txt",
  "tools/store/listing/fr.txt", "tools/store/listing/pt.txt",
  "winget/SerZhyAle.DocHtmlTranslate.locale.de-DE.yaml",
  "winget/SerZhyAle.DocHtmlTranslate.locale.it-IT.yaml",
  "winget/SerZhyAle.DocHtmlTranslate.locale.es-ES.yaml",
  "winget/SerZhyAle.DocHtmlTranslate.locale.fr-FR.yaml",
  "winget/SerZhyAle.DocHtmlTranslate.locale.pt-BR.yaml",

  # The Partner Center listing export: one column per Store locale, so every row carries German,
  # French, Italian, Portuguese and Spanish prose beside the English. It is a render target patched
  # from tools/store/listing/*.txt - the sources are what get spell-checked, and the five
  # Latin-script ones are already excluded above for the same reason.
  "tools/store/listingData.csv",
]
