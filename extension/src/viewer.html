<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="viewerTitle">Reflow viewer</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <div id="toolbar">
    <span class="title" id="doc-title" data-i18n="loading">Loading..</span>
    <span class="spacer"></span>
    <div class="group" data-i18n-title="ttToc" title="Table of contents">
      <button id="btn-toc" type="button" aria-controls="toc" aria-expanded="false"><span data-glyph="nav.contents"></span> <span data-i18n="ttToc">Table of contents</span></button>
    </div>
    <div class="group"><button id="btn-search" type="button" aria-controls="search-panel" aria-expanded="false" data-i18n="vSearch" title="Search">Search</button></div>
    <div class="group" data-i18n-title="ttFontSize" title="Font size">
      <button id="btn-font-dec" type="button" data-i18n-aria="ariaSmallerText" aria-label="Smaller text" data-i18n-title="ariaSmallerText" title="Smaller text"><span data-glyph="action.text-smaller"></span></button>
      <button id="btn-font-inc" type="button" data-i18n-aria="ariaLargerText" aria-label="Larger text" data-i18n-title="ariaLargerText" title="Larger text"><span data-glyph="action.text-larger"></span></button>
      <button id="btn-font-reset" type="button" data-i18n-aria="ariaResetTextSize" aria-label="Reset text size" data-i18n-title="ariaResetTextSize" title="Reset text size"><span data-glyph="action.reset"></span></button>
    </div>
    <div class="group">
      <select id="sel-family" data-i18n-aria="ariaFont" aria-label="Font">
        <option value="serif" data-i18n="fontSerif">Serif</option>
        <option value="sans" data-i18n="fontSans">Sans</option>
        <option value="mono" data-i18n="fontMono">Mono</option>
      </select>
      <select id="sel-leading" data-i18n-aria="ariaLineSpacing" aria-label="Line spacing" data-i18n-title="ariaLineSpacing" title="Line spacing">
        <option value="" data-i18n="optDefault">Default</option>
        <option value="1.4">1.4</option>
        <option value="1.6">1.6</option>
        <option value="1.9">1.9</option>
        <option value="2.2">2.2</option>
      </select>
      <select id="sel-width" data-i18n-aria="ariaColumnWidth" aria-label="Column width" data-i18n-title="ariaColumnWidth" title="Column width">
        <option value="" data-i18n="optDefault">Default</option>
        <option value="36em" data-i18n="optWidthNarrow">Narrow</option>
        <option value="46em" data-i18n="optWidthNormal">Normal</option>
        <option value="64em" data-i18n="optWidthWide">Wide</option>
        <option value="none" data-i18n="optWidthFull">Full width</option>
      </select>
      <span data-glyph="app.theme"></span>
      <select id="sel-theme" data-i18n-aria="ariaTheme" aria-label="Theme">
        <option value="light" data-i18n="themeLight">Light</option>
        <option value="sepia" data-i18n="themeSepia">Sepia</option>
        <option value="dark" data-i18n="themeDark">Dark</option>
        <option value="night" data-i18n="themeNight">Night</option>
      </select>
      <!-- Quick night-mode toggle: swaps between the day themes (light, sepia) and the night
           themes (dark, night), remembering the last of each; pressed = a night theme is on.
           Mirrors the app's #dht-night-toggle (docs/PARITY.md). -->
      <button id="btn-night" type="button" aria-pressed="false" data-i18n-aria="ariaNightMode" aria-label="Night mode" data-i18n-title="ariaNightMode" title="Night mode"><span data-glyph="app.night-mode"></span></button>
    </div>
    <!-- Revealed by viewer.js only on a document that carries OCR plates; mirrors the app's
         #dht-ocr-toggle (docs/PARITY.md). -->
    <div class="group" id="grp-ocr" hidden data-i18n-title="ttOcrLayer" title="Text layer">
      <button id="btn-ocr" type="button" aria-pressed="true" data-i18n-aria="ttOcrLayer" aria-label="Text layer"><span data-glyph="view.text-layer"></span></button>
    </div>
    <div class="group" data-i18n-title="ttGoToPage" title="Go to page">
      <span data-glyph="nav.go-to-page"></span>
      <span data-i18n="labelPage">Page</span>
      <input id="page-jump" type="number" min="1" value="1" data-i18n-aria="ttGoToPage" aria-label="Go to page">
      <span id="page-total">/ ?</span>
    </div>
    <div class="group">
      <button id="btn-open" type="button" data-i18n-title="ttOpenFile" title="Open a local document via the file picker" data-i18n="btnOpenFile">Open file</button>
      <button id="btn-original" type="button" data-i18n-title="ttOriginalPdf" title="Open the untouched PDF in the native viewer" data-i18n="btnOriginalPdf">Original PDF</button>
      <button id="btn-save-src" type="button" class="hidden" data-i18n-title="ttSaveSource" title="Save the original document file"><span data-glyph="action.save"></span> <span data-i18n="btnSaveFile">Save file</span></button>
      <button id="btn-save-html" type="button" class="hidden" data-i18n-title="ttSaveHtml" title="Export the current view as a standalone HTML file (keeps the translation if you translated the page)"><span data-glyph="action.export"></span> <span data-i18n="btnSaveHtml">Export HTML</span></button>
    </div>
    <a class="proj-link" href="https://serzhyale.github.io/doc-html-translate/" target="_blank" rel="noopener" title="doc-html-translate">doc-html-translate</a>
    <a class="proj-link" href="mailto:sza@ukr.net" data-i18n-title="ttFeedback" title="Feedback" data-i18n="linkFeedback">Feedback</a>
  </div>
  <input id="file-input" type="file" accept="application/pdf,.pdf,application/epub+zip,.epub,.txt,.rtf,.html,.htm,.md,.markdown,.fb2,.mobi,.azw3,image/png,.png,image/jpeg,.jpg,.jpeg,image/gif,.gif,image/bmp,.bmp,image/webp,.webp,.cbz,.cbr,.cb7,.cbt" class="hidden">

  <!-- role="status": reading/parsing stages and the OCR counter are status messages, so they
       are announced politely instead of only changing pixels. Updates are per stage, never per
       line, so the region stays quiet while pages render. -->
  <div id="status" role="status" aria-live="polite"><div id="progress-bar"></div><span id="status-text" data-i18n="loading">Loading..</span><button id="status-stop" type="button" hidden>Stop</button></div>

  <section id="search-panel" hidden data-i18n-aria="vSearch" aria-label="Search">
    <label for="search-input" data-i18n="vSearchText">Search text</label>
    <input id="search-input" type="search" autocomplete="off">
    <label for="search-scope" data-i18n="vSearchScope">Scope</label>
    <select id="search-scope"><option value="page" data-i18n="vSearchPage">This page</option><option value="book" data-i18n="vSearchBook">Whole book</option></select>
    <button id="search-close" type="button" data-i18n="vSearchClose">Close</button>
    <p id="search-status" role="status" aria-live="polite"></p><ol id="search-results"></ol>
  </section>

  <div id="layout">
    <nav id="toc" class="hidden" aria-label="Table of contents">
      <h2 data-i18n="tocHeading">Contents</h2>
      <div id="toc-tree"></div>
    </nav>
    <main id="content"></main>
  </div>

  <script type="module" src="viewer.js"></script>
</body>
</html>
