<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PDF reflow</title>
  <style>
    body { font-family: "Segoe UI", system-ui, sans-serif; width: 270px; margin: 0; padding: 12px 14px; color: #1b1b1b; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    .ver { color: #888; font-size: 11px; font-weight: normal; }
    .row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; gap: 8px; }
    .row label { font-size: 13px; }
    .host { color: #555; font-size: 12px; word-break: break-all; }
    .note { color: #666; font-size: 11px; margin: -2px 0 6px; line-height: 1.35; }
    .switch { position: relative; width: 38px; height: 22px; flex: 0 0 auto; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: #ccc; border-radius: 22px; transition: 0.2s; cursor: pointer; }
    .slider::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: 0.2s; }
    input:checked + .slider { background: #2563eb; }
    input:checked + .slider::before { transform: translateX(16px); }
    input:disabled + .slider { opacity: 0.4; cursor: not-allowed; }
    hr { border: 0; border-top: 1px solid #eee; margin: 12px 0; }
    a { color: #2563eb; font-size: 12px; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .links { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
    .cta { display: block; width: 100%; margin: 4px 0 12px; padding: 9px 12px; font: inherit; font-weight: 600;
           color: #fff; background: #2563eb; border: 0; border-radius: 8px; cursor: pointer; }
    .cta:hover { background: #1d4fd0; }
    .ocr-langs { margin: 2px 0 10px; }
    .ocr-langs summary { color: #2563eb; cursor: pointer; font-size: 12px; }
    .ocr-langs-content { margin-top: 6px; padding-left: 8px; border-left: 2px solid #eee; }
    .ocr-langs .hint { color: #666; font-size: 11px; margin: 2px 0 6px; }
    .ocr-lang { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0; }
    .ocr-lang label, .ocr-lang > span { font-size: 13px; }
    .ocr-lang button { font: inherit; font-size: 12px; padding: 2px 8px; border: 1px solid #2563eb; color: #2563eb;
           background: #fff; border-radius: 6px; cursor: pointer; }
    .ocr-lang button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <h1>doc-html-translate <span class="ver" id="ver"></span></h1>
  <button id="open-pdf" class="cta" type="button"  data-i18n="popupOpenDoc">Open a document&hellip;</button>
  <div class="row">
    <label for="ocr-images" data-i18n="popupUseOcr">Use OCR for images</label>
    <label class="switch"><input type="checkbox" id="ocr-images"><span class="slider"></span></label>
  </div>
  <details id="ocr-langs-details" class="ocr-langs">
    <summary data-i18n="popupOcrLangs">Recognition languages</summary>
    <div id="ocr-langs" class="ocr-langs-content"></div>
  </details>
  <hr>
  <div class="row">
    <label for="global" data-i18n="popupReflow">Reflow PDFs &amp; EPUBs</label>
    <label class="switch"><input type="checkbox" id="global"><span class="slider"></span></label>
  </div>
  <div class="note">Off by default. Or right-click a document link &rarr; &#8220;Convert with doc-html-translate&#8221;.</div>
  <div class="row">
    <label for="site" data-i18n="popupOnThisSite">On this site<br><span class="host" id="host"></span></label>
    <label class="switch"><input type="checkbox" id="site"><span class="slider"></span></label>
  </div>
  <hr>
  <div class="links">
    <a id="opts" href="#" data-i18n="popupOptions">Options</a>
    <a id="help" href="https://serzhyale.github.io/doc-html-translate/extension.html" target="_blank" rel="noopener">Guide &amp; help &#8599;</a>
  </div>
  <div class="links">
    <a href="https://serzhyale.github.io/doc-html-translate/" target="_blank" rel="noopener">Product site &#8599;</a>
    <a href="mailto:sza@ukr.net" data-i18n="linkFeedback">Feedback</a>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
