<!DOCTYPE html>
<html lang="en" data-boot>
<head>
  <meta charset="UTF-8">
  <title>PDF reflow</title>
  <link rel="stylesheet" href="chrome-palette.css">
  <link rel="stylesheet" href="ui-sizing.css">
  <link rel="stylesheet" href="ui-components.css">
  <link rel="stylesheet" href="popup.css">
  <script src="ui-boot.js"></script>
</head>
<body>
  <h1>doc-html-translate <span class="ver" id="ver"></span></h1>
  <p class="hint" id="tab-state" hidden></p>
  <div class="btn-row">
    <button id="open-pdf" class="primary" type="button"><span data-glyph="content.document"></span><span data-i18n="popupOpenDoc">Open a document&hellip;</span></button>
  </div>

  <div class="opt">
    <input type="checkbox" class="opt-box" id="ocr-images">
    <div class="opt-cell">
      <div class="opt-headrow">
        <label class="opt-name" for="ocr-images"><span data-glyph="view.text-layer"></span><span data-i18n="popupUseOcr">Use OCR for images</span></label>
      </div>
    </div>
  </div>
  <details id="popupOcrLangs" class="group">
    <summary data-i18n="popupOcrLangs">Recognition languages</summary>
    <div id="ocr-langs" class="body"></div>
  </details>

  <hr>

  <div class="opt">
    <input type="checkbox" class="opt-box" id="global" aria-describedby="convert-note">
    <div class="opt-cell">
      <div class="opt-headrow">
        <label class="opt-name" for="global" data-i18n="popupReflow">Reflow PDFs &amp; EPUBs</label>
      </div>
      <!-- Filled by popup.js: the message quotes the context-menu item by its own key, so the two
           never drift apart in any language. -->
      <p class="opt-expl" id="convert-note">Off by default. Or right-click a document link and choose &#8220;Convert with doc-html-translate&#8221;.</p>
    </div>
  </div>
  <p class="hint"><span data-i18n="siteModeLabel">Site mode</span>: <strong id="site-mode"></strong></p>
  <div class="opt">
    <input type="checkbox" class="opt-box" id="site" aria-describedby="site-expl">
    <div class="opt-cell">
      <div class="opt-headrow">
        <label class="opt-name" for="site"><span><span data-i18n="popupOnThisSite">On this site</span><span class="host" id="host"></span></span></label>
      </div>
      <p class="opt-expl" id="site-expl"><span id="site-membership"></span> <span id="site-reason"></span></p>
    </div>
  </div>

  <hr>

  <div class="btn-row">
    <button id="opts" type="button"><span data-glyph="app.settings"></span><span data-i18n="popupOptions">Settings</span></button>
  </div>
  <div class="links">
    <a class="ext" id="help" href="https://serzhyale.github.io/doc-html-translate/extension.html" target="_blank" rel="noopener"><span data-i18n="popupGuide">Guide &amp; help</span> <span data-glyph="nav.open-external"></span></a>
    <a class="ext" id="site-link" href="https://serzhyale.github.io/doc-html-translate/" target="_blank" rel="noopener"><span data-i18n="linkProductSite">Product site</span> <span data-glyph="nav.open-external"></span></a>
    <a class="ext" href="mailto:sza@ukr.net"><span data-i18n="linkFeedback">Feedback</span> <span data-glyph="nav.open-external"></span></a>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
