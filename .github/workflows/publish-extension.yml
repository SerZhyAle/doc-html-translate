# Publish the browser extension to the Chrome Web Store (and optionally Edge Add-ons)
# on a tag like `ext-v0.2.0`. This automates EVERY release AFTER the first manual one:
# the stores have no create-item / listing-metadata API, so the very first publish
# (item creation + listing/screenshots/privacy) is done by hand once. See
# extension/PUBLISHING.md for the one-time setup and the secrets/variables below.
#
# Runs on ubuntu-latest: extension/build.mjs now zips cross-platform (`zip` on
# Linux/macOS, Compress-Archive only on Windows dev machines).

name: publish-extension

on:
  push:
    tags:
      - "ext-v*"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

# Новый тег отменяет ещё не закончившийся прогон того же ref.
concurrency:
  group: publish-extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest        # вдвое дешевле windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"                                 # кэш npm-пакетов между прогонами
          cache-dependency-path: extension/package-lock.json

      - name: Install dev deps + build the store ZIP
        run: |
          npm ci --no-audit --no-fund                  # ci: детерминированно по lock-файлу
          npm run build

      - name: Publish to Chrome Web Store
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          # OAuth fallback (only if you did not configure a service account):
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: npm run publish:cws

      - name: Publish to Edge Add-ons
        if: ${{ vars.EDGE_PRODUCT_ID != '' }}
        env:
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: npm run publish:edge
